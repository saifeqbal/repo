<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lazy Load Test</title>
  <style>
    .spacer { height: 2000px; background: #f0f0f0; }
    img { display: block; max-width: 100%; height: auto; }
  </style>
</head>
<body>

  <h2>Scroll down to load the image</h2>
  
  <!-- Forces the image way down the page -->
  <div class="spacer"></div>

  <img src="https://via.placeholder.com/800x400" 
       width="800" 
       height="400" 
       alt="Lazy Loaded Image" 
       loading="lazy">

</body>
</html>
